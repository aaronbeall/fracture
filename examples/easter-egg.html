<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fracture easter egg</title>
    <link rel="stylesheet" href="./site.css" />
    <style>
      #root {
        display: grid;
        gap: 18px;
        margin: 28px 0;
      }
      fieldset {
        border: 1px solid var(--line);
        border-radius: 10px;
        display: grid;
        gap: 6px;
        margin: 12px 0 16px;
      }
      .logo {
        cursor: pointer;
        user-select: none;
      }
      input:not([type]) {
        font: inherit;
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
      }
      .sample {
        background: linear-gradient(130deg, #107a9c, #2554a3 65%, #6133a2);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="crumbs"><a href="./index.html">Fracture</a> / easter egg</div>
      <h1>Fracture <span class="trip">everything</span></h1>
      <p class="lede">
        Hide a "break the whole page" mode in your React app behind a secret.
      </p>
      <pre><code>useFractureEasterEgg({
  triggers: [{ sequence: "ya done messed up aaron!" }],
});</code></pre>
      <div id="root"></div>
      <p class="muted">Source: <code>examples/easter-egg.tsx</code></p>
    </main>
    <script type="module" src="./easter-egg.tsx"></script>
  </body>
</html>
